<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stop Motion Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="viewer">
      <div class="stage" id="stage">
        <canvas id="frameCanvas"></canvas>
        <video id="live" autoplay playsinline muted></video>
        <div class="flash" id="flash"></div>
        <div class="badge" id="badge">LIVE</div>
        <div class="message" id="message" hidden>
          <p id="messageText"></p>
          <button id="retryBtn" class="btn">Try again</button>
        </div>
      </div>

      <div class="filmstrip" id="filmstrip" aria-label="Captured frames">
        <p class="empty">Captured frames will appear here. Press <kbd>Space</kbd> to capture.</p>
      </div>
    </section>

    <aside class="panel" aria-label="Controls">
      <div class="field">
        <label class="field-label" for="cameraSelect">Camera</label>
        <select id="cameraSelect" disabled>
          <option>Waiting for camera…</option>
        </select>
        <label class="check">
          <input id="mirrorInput" type="checkbox">
          <span>Mirror image</span>
        </label>
      </div>

      <div class="buttons">
        <button id="captureBtn" class="btn btn-capture" title="Capture frame (Space)" disabled>
          <span class="shutter"></span>
          Capture
        </button>
        <button id="removeBtn" class="btn" title="Remove selected frame (Backspace)" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
          Remove
        </button>
        <button id="playBtn" class="btn" title="Play / Stop (P)" disabled>
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>
          <span class="label">Play</span>
        </button>
        <button id="downloadBtn" class="btn btn-wide" title="Download video" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>
          <span class="label">Download</span>
        </button>
      </div>

      <div class="sound">
        <div class="section-head">
          <span class="field-label">Sound</span>
          <span id="audioStatus" class="audio-status">No audio yet</span>
        </div>
        <select id="micSelect" aria-label="Microphone">
          <option value="">Default microphone</option>
        </select>
        <div class="sound-buttons">
          <button id="recordAudioBtn" class="btn btn-record" title="Record audio (R)" disabled>
            <span class="rec-dot"></span>
            <span class="label">Record audio</span>
          </button>
          <button id="removeAudioBtn" class="btn btn-quiet" disabled>Remove</button>
        </div>
      </div>

      <div class="settings">
        <label class="slider">
          <span>Speed <output id="fpsOut">8</output> fps</span>
          <input id="fpsInput" type="range" min="1" max="30" step="1" value="8">
        </label>
        <label class="slider">
          <span>Live ghost <output id="ghostOut">50</output>%</span>
          <input id="ghostInput" type="range" min="0" max="50" step="5" value="50">
        </label>
      </div>

      <div class="stats">
        <span><strong id="frameCount">0</strong> frames · <span id="duration">0.0s</span></span>
        <button id="clearBtn" class="btn btn-quiet" disabled>Start over</button>
      </div>

      <ul class="hints">
        <li><kbd>Space</kbd> capture</li>
        <li><kbd>Backspace</kbd> remove frame</li>
        <li><kbd>←</kbd> <kbd>→</kbd> choose frame</li>
        <li><kbd>P</kbd> play / stop</li>
        <li><kbd>R</kbd> record audio</li>
      </ul>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
